  }
  function deleteFolderFlow(fo) {
    let withC = false;
    const cb = h('input', { type: 'checkbox', id: 'df-c', onchange: (e) => { withC = e.target.checked; } });
    openSheet('Apagar pasta', [
      h('p', { text: `A pasta "${fo.name}" tem ${fo.circuits.length} circuito(s). Por padrão eles ficam soltos.` }),
      h('label', { class: 'choice' }, cb, h('span', { text: 'Apagar também os circuitos da pasta' })),
    ], [
      h('button', { class: 'btn', onclick: closeSheet, text: 'Cancelar' }),
      h('button', { class: 'btn danger', text: 'Apagar', onclick: () => { closeSheet(); apply((d) => GP.deleteFolder(d, fo.name, withC)); } }),
    ]);
  }
  function actionBar() {
    const n = state.sel.size;
    if (isGrid() || !n) return null;
    const b = (text, fn, cls) => h('button', { class: 'btn small ' + (cls || ''), onclick: fn, text });
    return h('div', { class: 'actionbar' }, h('div', { class: 'inner' },
      h('span', { class: 'sel', text: `${n} selecionado${n === 1 ? '' : 's'}` }),
      b('Mover para…', moveFlow), b('Nova pasta…', newFolderFlow), b('Tirar da pasta', () => doneSel(apply((d) => GP.moveCircuits(d, selIdx(), null)))),
      b('Extrair', () => { const doc = GP.extractCircuits(state.doc, selIdx()); saveDoc(doc, stem() + '_extraido', false); }),
      b('Apagar', deleteCircuitsFlow, 'danger'), b('Limpar', () => { state.sel.clear(); render(); }, 'ghost')));
  }
  // Depois de mover/criar pasta a seleção acaba, para a próxima ação não atingir os mesmos circuitos.
  function doneSel(ok) { if (ok) { state.sel.clear(); render(); } return ok; }
  function moveFlow() {
    const folders = state.doc.folders || [];
    if (!folders.length) return newFolderFlow();
    let pick = folders[0].name;
    openSheet('Mover para qual pasta?', folders.map((fo, i) => h('label', { class: 'choice' },
      h('input', { type: 'radio', name: 'mv', checked: i === 0, onchange: () => { pick = fo.name; } }), h('span', { text: `${fo.name} (${fo.circuits.length})` }))), [
      h('button', { class: 'btn', onclick: closeSheet, text: 'Cancelar' }),
      h('button', { class: 'btn primary', text: 'Mover', onclick: () => { closeSheet(); doneSel(apply((d) => GP.moveCircuits(d, selIdx(), pick))); } }),
    ]);
  }
  async function newFolderFlow() {
    const n = await textSheet('Nova pasta', 'Nome da pasta', '', 'Criar');
    if (n) doneSel(apply((d) => GP.createFolder(d, n, selIdx())));
  }
  async function deleteCircuitsFlow() {
    const names = selIdx().map((i) => state.doc.circuits[i].name);
    if (await confirmSheet('Apagar circuitos?', `${names.length === 1 ? '"' + names[0] + '"' : names.length + ' circuitos'} será(ão) removido(s) do arquivo.`, 'Apagar', true)) apply((d) => GP.deleteCircuits(d, selIdx(), false));
  }

  // --------------------------------------------------------------- arquivo ---
  function filePanel() {
    const doc = state.doc;
    const nameInput = h('input', { type: 'text', id: 'out-name', value: stem() + (state.sample ? '' : '_editado'), maxlength: '80', autocomplete: 'off' });
    const nodes = [];
    if (isGrid()) {
      nodes.push(h('div', { class: 'card' }, h('h3', { text: 'Grid' }),
        h('div', { class: 'field' }, h('label', { for: 'g-name', text: 'Nome do grid' }),
          h('input', { type: 'text', id: 'g-name', value: doc.name, maxlength: '60', onchange: (e) => { const v = e.target.value; apply((d) => { if (!v.trim()) throw new GP.GPError('O nome do grid não pode ficar vazio.'); d.name = v.trim(); return 'Nome do grid alterado.'; }); } })),
        h('dl', { class: 'kv', style: 'margin-top:10px' }, h('dt', { text: 'Equipes' }), h('dd', { text: doc.teams.length }), h('dt', { text: 'Pilotos' }), h('dd', { text: doc.drivers.length }), h('dt', { text: 'Inscritos' }), h('dd', { text: doc.drivers.filter((d) => d.entered).length }))));
    } else {
      nodes.push(h('div', { class: 'card' }, h('h3', { text: 'Coleção de circuitos' }),
        h('dl', { class: 'kv' }, h('dt', { text: 'Circuitos' }), h('dd', { text: doc.circuits.length }), h('dt', { text: 'Pastas' }), h('dd', { text: (doc.folders || []).length }))));
    }
    const ns = GP.notes(doc);
    if (ns.length) nodes.push(h('div', { class: 'banner' }, ns.map((t) => h('div', { text: t }))));
    const mergeIn = h('input', { type: 'file', id: 'merge-in', multiple: true, hidden: true, onchange: (e) => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) mergeFiles(fs); } });
    const newIn = h('input', { type: 'file', id: 'mergenew-in', multiple: true, hidden: true, onchange: (e) => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) mergeNew(fs); } });
    nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Juntar vários arquivos em um novo' }),
      h('p', { text: 'Escolha 2 ou mais arquivos do mesmo tipo (grids com grids, circuitos com circuitos). Cria um arquivo novo e deixa de lado o que está aberto. Os originais não são alterados.' }),
      newIn, h('button', { class: 'btn', onclick: () => newIn.click(), text: 'Escolher 2 ou mais arquivos' })));
    if (isGrid()) {
      nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Verificar o grid' }),
        h('p', { text: 'Procura números e siglas repetidos, equipes sem piloto, atributos estranhos e pilotos sem capacete.' }),
        h('button', { class: 'btn', onclick: auditSheet, text: 'Verificar agora' })));
      nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Exportar como lista (planilha)' }),
        h('p', { text: 'Gera o texto da lista de pilotos ou de equipes, no mesmo formato que "Importar listas" lê. Dá para copiar, editar em outro app e colar de volta. O excesso acima de 99 não vai na lista.' }),
        h('div', { class: 'row-actions' }, h('button', { class: 'btn', onclick: () => csvSheet('drivers'), text: 'Lista de pilotos' }), h('button', { class: 'btn', onclick: () => csvSheet('teams'), text: 'Lista de equipes' }))));
    }
    if (isGrid()) {
      nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Importar listas' }),
        h('p', { text: 'Cole uma lista (de uma planilha ou de um texto) e crie vários pilotos ou equipes de uma vez. Se os pilotos usarem equipes novas, importe as equipes primeiro ou marque "Criar equipes que faltam".' }),
        h('div', { class: 'row-actions' }, h('button', { class: 'btn', onclick: importSheet, text: 'Colar lista de pilotos' }), h('button', { class: 'btn', onclick: importTeamsSheet, text: 'Colar lista de equipes' }))));
      const cpIn = h('input', { type: 'file', id: 'copy-in', hidden: true, onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) copyFromFile(f); } });
      nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Copiar pilotos de outro grid' }),
        h('p', { text: 'Abre outro grid só para escolher quais pilotos ou equipes trazer para este.' }),
        cpIn, h('button', { class: 'btn', onclick: () => cpIn.click(), text: 'Escolher o grid de origem' })));
    }
    nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Juntar outro arquivo' }),
      h('p', { text: isGrid() ? 'Acrescenta TODAS as equipes e pilotos do outro arquivo ao final deste.' : 'Acrescenta os circuitos e as pastas do outro arquivo. Pastas com o mesmo nome se unem.' }),
      mergeIn, h('button', { class: 'btn', onclick: () => mergeIn.click(), text: 'Escolher arquivo(s) para juntar' })));
    const jsonCard = h('div', { class: 'card stack' }, h('h3', { text: 'Alternativa: como JSON' }),
      h('p', { text: 'Texto puro do arquivo, sem compactar. Cole num app de notas e salve com o nome terminando em ".geoprix", ou baixe como .json e renomeie. O Geoprix já abriu JSON renomeado assim para você (vindo de outra ferramenta); eu não consegui testar isso no jogo, então se der erro use o botão "Salvar arquivo .geoprix" acima.' }),
      h('div', { class: 'row-actions' },
        h('button', { class: 'btn', text: 'Copiar JSON', onclick: async () => { const t = GP.toJson(state.doc); try { await navigator.clipboard.writeText(t); toast('JSON copiado.'); } catch (e) { jsonTa.hidden = false; jsonTa.value = t; jsonTa.focus(); jsonTa.select(); toast('Selecionei o texto: use Copiar do seu teclado.'); } } }),
        h('button', { class: 'btn', text: 'Baixar .json', onclick: async () => { const problems = GP.check(state.doc); if (problems.length) return toast(problems[0], 'err'); const dl = await cap('downloads'); if (!dl) return toast('Este lugar não baixa arquivos. Use Copiar JSON.', 'err'); try { await dl.save({ filename: (nameInput.value.trim() || stem()) + '.json', data: new TextEncoder().encode(GP.toJson(state.doc)) }); toast('Salvo como .json. Renomeie para .geoprix.'); } catch (e) { toast(e && e.code === 'declined' ? 'Cancelado.' : 'Não consegui baixar. Use Copiar JSON.', 'err'); } } })));
    const jsonTa = h('textarea', { class: 'jsonout', readonly: true, hidden: true, rows: '8', 'aria-label': 'JSON' }); jsonCard.append(jsonTa);
    nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Salvar' }),
      h('div', { class: 'field' }, h('label', { for: 'out-name', text: 'Nome do arquivo' }), nameInput),
      h('button', { class: 'btn primary', text: 'Salvar arquivo .geoprix', onclick: () => saveDoc(state.doc, nameInput.value.trim() || stem(), true) }),
      h('p', { text: 'O arquivo é recompactado e relido antes de salvar. Os originais nunca são alterados: o resultado é sempre um arquivo novo. Se o seu navegador só aceitar salvar com ".txt" no final, renomeie para tirar o ".txt".' })));
    nodes.push(jsonCard);
    if (state.fallback) {
      const ta = h('textarea', { class: 'out', readonly: true, 'aria-label': 'Arquivo em texto', onfocus: (e) => e.target.select() }); ta.value = state.fallback.text;
      nodes.push(h('div', { class: 'card stack' }, h('h3', { text: 'Se não conseguir salvar' }),
        h('p', { text: `Copie este texto e cole no chat com o Claude, pedindo para transformar em "${state.fallback.name}.geoprix". É o mesmo arquivo, em base64. Ou, mais simples, use "Alternativa: como JSON" logo acima.` }), ta,
        h('button', { class: 'btn', text: 'Copiar como texto', onclick: async () => { try { await navigator.clipboard.writeText(state.fallback.text); toast('Copiado.'); } catch (e) { ta.focus(); ta.select(); toast('Selecionei o texto: use Copiar do seu teclado.'); } } })));
    }
    return nodes;
  }

  // --------------------------------------------------------------- render ----
  function render() {
    const doc = state.doc, grid = isGrid();
    const tabs = grid ? [['drivers', 'Pilotos'], ['teams', 'Equipes'], ['file', 'Arquivo']] : [['circuits', 'Circuitos'], ['file', 'Arquivo']];
    if (!tabs.some(([k]) => k === state.tab)) state.tab = tabs[0][0];
    const fileIn = h('input', { type: 'file', id: 'open-in', hidden: true, onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f); } });
    const bar = h('div', { class: 'bar' },
      h('div', { class: 'bar-row' },
        h('div', { style: 'min-width:0' }, h('div', { class: 'brand', text: 'Geoprix Editor' }),
          h('div', { class: 'fname' }, dirty() ? h('span', { class: 'dot', title: 'Alterações não salvas' }) : null, h('span', { text: state.sample ? 'Exemplo' : state.fileName + (dirty() ? ' · não salvo' : '') }))),
        h('div', { class: 'row-actions' }, fileIn,
          h('button', { class: 'btn small ghost', onclick: undo, disabled: !state.history.length, text: 'Desfazer' }),
          h('button', { class: 'btn small', onclick: () => fileIn.click(), text: 'Abrir' }))),
      h('div', { class: 'tabs', role: 'tablist' }, tabs.map(([k, label]) => h('button', { class: 'tab', role: 'tab', 'aria-selected': String(state.tab === k), onclick: () => { state.tab = k; render(); window.scrollTo(0, 0); }, text: label }))));
    const body = [];
    if (state.sample) body.push(h('div', { class: 'banner info', text: 'Isto é um grid de exemplo, só para mostrar como funciona. Toque em "Abrir" e escolha o seu arquivo .geoprix. Para juntar vários arquivos de uma vez, use a aba Arquivo.' }));
    const panel = state.tab === 'drivers' ? driversPanel() : state.tab === 'teams' ? teamsPanel() : state.tab === 'circuits' ? circuitsPanel() : filePanel();
    const scroll = window.scrollY;
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    app.replaceChildren(bar, ...body, ...panel);
    document.querySelectorAll('.actionbar').forEach((n) => n.remove());
    const ab = actionBar(); if (ab) document.body.append(ab);
    document.body.classList.toggle('has-actionbar', !!ab);
    window.scrollTo(0, scroll);
    if (hadFocus) { const q = document.getElementById('q'); if (q) q.focus(); }
  }
  window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
  render();
  })();

</script>
